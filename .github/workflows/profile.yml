name: Update 3D Contributions

on:
  schedule:
    - cron: "30 0 * * *" # 08:30 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile.yml
      - config/profile-3d.json

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile configuration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Generate blue 3D contribution views
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/profile-3d.json

      - name: Collect and validate generated images
        run: |
          mkdir -p dist
          cp profile-3d-contrib/city-light.svg profile-3d-contrib/city-dark.svg dist/
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          names = ['city-light', 'city-dark']
          for name in names:
              path = Path('dist') / f'{name}.svg'
              root = ET.parse(path).getroot()
              if root.tag != '{http://www.w3.org/2000/svg}svg':
                  raise ValueError(f'{path} is not an SVG')
              print(f'Validated {path}')
          PY

      - name: Publish 3D contribution images
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: profile-assets
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
