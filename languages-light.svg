<svg xmlns="http://www.w3.org/2000/svg" width="320" height="245" viewBox="0 0 320 245" fill="none" role="img" aria-labelledby="descId">
        <title id="titleId" />
        <desc id="descId" />
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #1f6feb;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #1f2328;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #1f2328;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    .progress-background { fill: #ddd; }
    
          

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          * { animation-duration: 0s !important; animation-delay: 0s !important; }
        </style>

        
        <defs>
          
          
        </defs>
        

        <rect data-testid="card-bg" class="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#d0d7de" width="319" fill="#ffffff" stroke-opacity="1" />

        
      <g data-testid="card-title" transform="translate(25, 35)">
        <g transform="translate(0, 0)">
      <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
    </g>
      </g>
    

        <g data-testid="main-card-body" transform="translate(0, 55)">
          
    <svg data-testid="lang-items" x="25">
      <g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">TypeScript</text>
      <text x="235" y="34" class="lang-name">34.02%</text>
      
    <svg width="225" x="0" y="25">
      <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="225" height="8" />
      <svg data-testid="lang-progress" width="34.0157210934432%">
        <rect height="8" fill="#3178c6" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 750ms;" />
      </svg>
    </svg>
  
    </g>
  </g><g transform="translate(0, 40)">
    <g class="stagger" style="animation-delay: 600ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">Python</text>
      <text x="235" y="34" class="lang-name">27.94%</text>
      
    <svg width="225" x="0" y="25">
      <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="225" height="8" />
      <svg data-testid="lang-progress" width="27.94023635059017%">
        <rect height="8" fill="#3572A5" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 900ms;" />
      </svg>
    </svg>
  
    </g>
  </g><g transform="translate(0, 80)">
    <g class="stagger" style="animation-delay: 750ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">JavaScript</text>
      <text x="235" y="34" class="lang-name">23.09%</text>
      
    <svg width="225" x="0" y="25">
      <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="225" height="8" />
      <svg data-testid="lang-progress" width="23.089596873759287%">
        <rect height="8" fill="#f1e05a" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1050ms;" />
      </svg>
    </svg>
  
    </g>
  </g><g transform="translate(0, 120)">
    <g class="stagger" style="animation-delay: 900ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">Rust</text>
      <text x="235" y="34" class="lang-name">14.95%</text>
      
    <svg width="225" x="0" y="25">
      <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="225" height="8" />
      <svg data-testid="lang-progress" width="14.954445682207343%">
        <rect height="8" fill="#dea584" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1200ms;" />
      </svg>
    </svg>
  
    </g>
  </g>
    </svg>
  
        </g>
      <style>
      * { animation: none !important; }
      .stagger { opacity: 1 !important; }
      .lang-progress { width: 100%; }
    </style></svg>